- insert:
    - id: antfarm-client-anchor
      name: dsh-antfarm
    - id: antfarm-runtime
      name: dsh-antfarm/runtime
      config:
        journalRoot: !!js dshHomePath('antfarm/runs')
        workflowDirs:
          - !!js dshHomePath('antfarm/workflows')
    - id: antfarm-studio-host
      name: dsh-antfarm/studio-host
    - id: antfarm-tool
      name: dsh-antfarm/tool
    - id: antfarm-commands
      name: dsh-antfarm/commands
