id: writing
name: Writing and editing
version: 2
workspace: files
description: Plan a document, write it, and independently check the requested constraints.
inputs: []
agents:
  - id: planner
    preset: antfarm-analysis
    instructions: agents/planner.md
  - id: writer
    preset: antfarm-coding
    instructions: agents/writer.md
  - id: editor
    preset: antfarm-verification
    instructions: agents/editor.md
steps:
  - id: plan
    agent: planner
    input: Plan {{task}} using the supplied inputs in {{workspace}}/inputs. Return outline and constraints as named values.
  - id: write
    agent: writer
    input: Write document.md for {{task}} in {{workspace}}. Planning handoffs are {{results}}
  - id: edit
    agent: editor
    requireChecks: true
    input: Check document.md against {{task}} and the saved planning handoffs. Execute file and content checks and cite successful commands in checks. {{results}}
    maxRetries: 1
    onFail:
      retryStep: write
      maxRetries: 2
      onExhausted:
        escalateTo: human
