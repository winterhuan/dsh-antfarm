- insert:
    - id: antfarm-client-anchor
      name: dsh-antfarm
    - id: antfarm-runtime
      name: dsh-antfarm/runtime
      config:
        journalRoot: !!js dshHomePath('antfarm/runs')
        workflowDirs:
          - !!js dshHomePath('antfarm/workflows')
    - id: antfarm-studio-host
      name: dsh-antfarm/studio-host
    - id: antfarm-tool
      name: dsh-antfarm/tool
    - id: antfarm-commands
      name: dsh-antfarm/commands
    - id: antfarm-analysis-preset
      name: "@deepseek-ai/dsh-agent-preset"
      config:
        id: antfarm-analysis
        name: Antfarm Analysis
        description: Read and plan one Antfarm workflow step.
        plugins:
          - id: persona
            name: "@deepseek-ai/dsh-persona"
            config:
              prefix: Follow the supplied Antfarm step instructions and return the requested
                structured result. Report evidence and uncertainty. Do not start
                another Antfarm workflow.
          - id: agent-instructions
            name: "@deepseek-ai/dsh-agent-instructions"
            config:
              maxBytes: 65536
          - id: tool-fs
            name: "@deepseek-ai/dsh-tool-fs"
            config:
              write: false
              edit: false
              applyPatch: false
          - id: tool-fs-search
            name: "@deepseek-ai/dsh-tool-fs-search"
            config:
              sampleOverCapGlobResults: false
          - id: skill-filesystem
            name: "@deepseek-ai/dsh-skill-filesystem"
          - id: tool-skill
            name: "@deepseek-ai/dsh-tool-skill"
    - id: antfarm-coding-preset
      name: "@deepseek-ai/dsh-agent-preset"
      config:
        id: antfarm-coding
        name: Antfarm Coding
        description: Implement one Antfarm workflow step in its owned worktree.
        plugins:
          - id: persona
            name: "@deepseek-ai/dsh-persona"
            config:
              prefix: Follow the supplied Antfarm step instructions and return the requested
                structured result. Work in the supplied directory. Do not start
                another Antfarm workflow.
          - id: agent-instructions
            name: "@deepseek-ai/dsh-agent-instructions"
            config:
              maxBytes: 65536
          - id: tool-fs
            name: "@deepseek-ai/dsh-tool-fs"
            config:
              applyPatch: true
          - id: tool-fs-search
            name: "@deepseek-ai/dsh-tool-fs-search"
            config:
              sampleOverCapGlobResults: false
          - id: tool-bash
            name: "@deepseek-ai/dsh-tool-bash"
          - id: skill-filesystem
            name: "@deepseek-ai/dsh-skill-filesystem"
          - id: tool-skill
            name: "@deepseek-ai/dsh-tool-skill"
    - id: antfarm-verification-preset
      name: "@deepseek-ai/dsh-agent-preset"
      config:
        id: antfarm-verification
        name: Antfarm Verification
        description: Independently inspect changes and run verification commands.
        plugins:
          - id: persona
            name: "@deepseek-ai/dsh-persona"
            config:
              prefix: Verify the supplied work using evidence and the requested checks. Shell
                commands may modify files; avoid unrelated changes. Return the
                requested structured result. Do not start another Antfarm
                workflow.
          - id: agent-instructions
            name: "@deepseek-ai/dsh-agent-instructions"
            config:
              maxBytes: 65536
          - id: tool-fs
            name: "@deepseek-ai/dsh-tool-fs"
            config:
              write: false
              edit: false
              applyPatch: false
          - id: tool-fs-search
            name: "@deepseek-ai/dsh-tool-fs-search"
            config:
              sampleOverCapGlobResults: false
          - id: tool-bash
            name: "@deepseek-ai/dsh-tool-bash"
          - id: skill-filesystem
            name: "@deepseek-ai/dsh-skill-filesystem"
          - id: tool-skill
            name: "@deepseek-ai/dsh-tool-skill"
    - id: antfarm-testing-preset
      name: "@deepseek-ai/dsh-agent-preset"
      config:
        id: antfarm-testing
        name: Antfarm testing
        description: Execute the declared testing role using native tools and permissions.
        plugins:
          - id: persona
            name: "@deepseek-ai/dsh-persona"
            config:
              prefix: Verify the supplied work using evidence and the requested checks. Shell
                commands may modify files; avoid unrelated changes. Return the
                requested structured result. Do not start another Antfarm
                workflow.
          - id: agent-instructions
            name: "@deepseek-ai/dsh-agent-instructions"
            config:
              maxBytes: 65536
          - id: tool-fs
            name: "@deepseek-ai/dsh-tool-fs"
            config:
              write: false
              edit: false
              applyPatch: false
          - id: tool-fs-search
            name: "@deepseek-ai/dsh-tool-fs-search"
            config:
              sampleOverCapGlobResults: false
          - id: tool-bash
            name: "@deepseek-ai/dsh-tool-bash"
          - id: skill-filesystem
            name: "@deepseek-ai/dsh-skill-filesystem"
          - id: tool-skill
            name: "@deepseek-ai/dsh-tool-skill"
    - id: antfarm-scanning-preset
      name: "@deepseek-ai/dsh-agent-preset"
      config:
        id: antfarm-scanning
        name: Antfarm scanning
        description: Execute the declared scanning role using native tools and permissions.
        plugins:
          - id: persona
            name: "@deepseek-ai/dsh-persona"
            config:
              prefix: Verify the supplied work using evidence and the requested checks. Shell
                commands may modify files; avoid unrelated changes. Return the
