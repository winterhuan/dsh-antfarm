id: smoke
name: Antfarm smoke
version: 2
description: One coding agent completes a task through DSH.
agents:
  - id: worker
    name: Smoke worker
    timeoutSeconds: 900
    preset: antfarm-coding
    instructions: agents/worker.md
steps:
  - id: execute
    agent: worker
    type: single
    input: |
      Work in {{workspace}} on branch {{branch}}.

      Complete this task:
      {{task}}

      Inspect the repository, make the requested implementation, and run the focused checks needed for your changes.
    maxRetries: 1
    output: result
