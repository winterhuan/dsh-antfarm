          - id: agent-instructions
            name: "@deepseek-ai/dsh-agent-instructions"
            config:
              maxBytes: 65536
          - id: tool-fs
            name: "@deepseek-ai/dsh-tool-fs"
            config:
              write: false
              edit: false
              applyPatch: false
          - id: tool-fs-search
            name: "@deepseek-ai/dsh-tool-fs-search"
            config:
              sampleOverCapGlobResults: false
          - id: tool-bash
            name: "@deepseek-ai/dsh-tool-bash"
          - id: skill-filesystem
            name: "@deepseek-ai/dsh-skill-filesystem"
          - id: tool-skill
            name: "@deepseek-ai/dsh-tool-skill"
    - id: antfarm-pr-preset
      name: "@deepseek-ai/dsh-agent-preset"
      config:
        id: antfarm-pr
        name: Antfarm pr
        description: Execute the declared pr role using native tools and permissions.
        plugins:
          - id: persona
            name: "@deepseek-ai/dsh-persona"
            config:
              prefix: Follow the supplied Antfarm step instructions and return the requested
                structured result. Work in the supplied directory. Do not start
                another Antfarm workflow.
          - id: agent-instructions
            name: "@deepseek-ai/dsh-agent-instructions"
            config:
              maxBytes: 65536
          - id: tool-fs
            name: "@deepseek-ai/dsh-tool-fs"
            config:
              applyPatch: true
          - id: tool-fs-search
            name: "@deepseek-ai/dsh-tool-fs-search"
            config:
              sampleOverCapGlobResults: false
          - id: tool-bash
            name: "@deepseek-ai/dsh-tool-bash"
          - id: skill-filesystem
            name: "@deepseek-ai/dsh-skill-filesystem"
          - id: tool-skill
            name: "@deepseek-ai/dsh-tool-skill"
